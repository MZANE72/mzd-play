<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MZD Play</title>
<style>
  :root{
    --bg:#0f1220; --card:#181c2f; --card2:#20263f; --text:#eef1ff;
    --muted:#9aa3c7; --accent:#7c5cff; --accent2:#00d4ff; --danger:#ff5c7a;
  }
  body.light{
    --bg:#f4f6fb; --card:#ffffff; --card2:#eef1f8; --text:#161a2b;
    --muted:#5f6780; --accent:#6a4cff; --accent2:#0090c0;
  }
  *{box-sizing:border-box; font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
  body{margin:0; background:var(--bg); color:var(--text); min-height:100vh}
  .app{max-width:1050px; margin:auto; padding:20px}
  header{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px}
  h1{margin:0; font-size:26px; letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; color:transparent}
  .top-actions{display:flex; gap:8px; flex-wrap:wrap}
  button, select, input{border:0; outline:0; border-radius:12px; color:var(--text)}
  button{background:var(--card2); padding:10px 14px; cursor:pointer; font-weight:600; transition:.2s}
  button:hover{filter:brightness(1.15)}
  button.primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:white}
  button.icon{width:46px; height:46px; padding:0; font-size:18px; display:grid; place-items:center}
  .layout{display:grid; grid-template-columns:1fr 360px; gap:18px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  .card{background:var(--card); border:1px solid color-mix(in srgb,var(--muted) 25%,transparent); border-radius:20px; padding:18px}
  .now{display:flex; gap:16px; align-items:center; margin-bottom:16px}
  .cover{width:92px; height:92px; border-radius:18px; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid; place-items:center; font-size:34px; flex-shrink:0}
  .track-info{min-width:0}
  .title{font-size:20px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .artist{color:var(--muted); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .controls{display:flex; justify-content:center; align-items:center; gap:10px; margin:14px 0}
  .controls .play{width:62px; height:62px; font-size:24px; border-radius:50%}
  .bar-row{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted)}
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:6px; background:var(--card2); border-radius:99px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer}
  .secondary-row{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap}
  .toggle{background:var(--card2)}
  .toggle.on{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:white}
  .list-head{display:flex; gap:8px; margin-bottom:12px}
  .list-head input{flex:1; background:var(--card2); padding:11px 13px}
  .playlist{display:flex; flex-direction:column; gap:8px; max-height:430px; overflow:auto; padding-right:4px}
  .song{display:flex; align-items:center; gap:10px; background:var(--card2); padding:10px 12px; border-radius:14px; cursor:pointer}
  .song:hover{filter:brightness(1.12)}
  .song.active{outline:2px solid var(--accent)}
  .song .num{width:24px; color:var(--muted); font-size:12px}
  .song .meta{flex:1; min-width:0}
  .song .name{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .song .sub{font-size:12px; color:var(--muted)}
  .song .remove{background:transparent; color:var(--danger); padding:4px 8px}
  .empty{text-align:center; color:var(--muted); padding:30px 10px}
  .drop{border:2px dashed color-mix(in srgb,var(--muted) 50%,transparent); border-radius:16px; padding:18px; text-align:center; color:var(--muted); margin-bottom:14px}
  .drop.over{border-color:var(--accent); color:var(--text)}
  footer{margin-top:16px; color:var(--muted); font-size:12px; text-align:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎧 MZD <span>Play</span></h1>
    <div class="top-actions">
      <label><input type="file" id="fileInput" accept="audio/*" multiple hidden><button class="primary">＋ Şarkı ekle</button></label>
      <button id="themeBtn">🌙 Tema</button>
    </div>
  </header>

  <div class="layout">
    <section class="card">
      <div class="now">
        <div class="cover">🎵</div>
        <div class="track-info">
          <div class="title" id="nowTitle">Şarkı seçilmedi</div>
          <div class="artist" id="nowArtist">Yerel müzik çaların</div>
        </div>
      </div>

      <div class="bar-row">
        <span id="currentTime">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="icon" id="prevBtn" title="Önceki">⏮</button>
        <button class="icon play" id="playBtn" title="Oynat/Duraklat">▶</button>
        <button class="icon" id="nextBtn" title="Sonraki">⏭</button>
      </div>

      <div class="bar-row">
        <span>🔊</span>
        <input type="range" id="volume" min="0" max="100" value="80">
        <span id="volLabel">80%</span>
      </div>

      <div class="secondary-row">
        <button class="toggle" id="shuffleBtn">🔀 Karıştır</button>
        <button class="toggle" id="repeatBtn">🔁 Tekrar: Kapalı</button>
        <select id="speed">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </section>

    <section class="card">
      <div class="list-head">
        <input id="search" placeholder="🔍 Şarkı ara...">
        <button id="clearBtn" title="Listeyi temizle">🗑</button>
      </div>
      <div class="drop" id="dropZone">Dosyaları buraya sürükleyip bırak</div>
      <div class="playlist" id="playlist"></div>
    </section>
  </div>

  <footer>Şarkılar yalnızca tarayıcında saklanır; sunucuya yüklenmez.</footer>
</div>

<audio id="audio"></audio>

<script>
const audio=document.getElementById('audio');
const playlistEl=document.getElementById('playlist');
const fileInput=document.getElementById('fileInput');
const dropZone=document.getElementById('dropZone');
let tracks=[], current=-1, shuffle=false, repeatMode=0;

fileInput.addEventListener('change',e=>addFiles(e.target.files));
document.querySelector('label').addEventListener('click',()=>fileInput.click());

['dragover','dragleave','drop'].forEach(ev=>{
  dropZone.addEventListener(ev,e=>{
    e.preventDefault();
    dropZone.classList.toggle('over',ev==='dragover');
    if(ev==='drop') addFiles(e.dataTransfer.files);
  });
});

function addFiles(files){
  [...files].filter(f=>f.type.startsWith('audio/')).forEach(f=>{
    tracks.push({name:f.name.replace(/.[^.]+$/,''),artist:'Yerel dosya',url:URL.createObjectURL(f),duration:'—'});
  });
  render();
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  playlistEl.innerHTML='';
  const visible=tracks.map((t,i)=>({t,i})).filter(({t})=>t.name.toLowerCase().includes(q));
  if(!visible.length){playlistEl.innerHTML='<div class="empty">Henüz şarkı yok.<br>“＋ Şarkı ekle” ile başla.</div>';return}
  visible.forEach(({t,i},n)=>{
    const div=document.createElement('div');
    div.className='song'+(i===current?' active':'');
    div.innerHTML=`<div class="num">${i===current?'▶':n+1}</div>
      <div class="meta"><div class="name">${t.name}</div><div class="sub">${t.artist}</div></div>
      <button class="remove">✕</button>`;
    div.onclick=()=>play(i);
    div.querySelector('.remove').onclick=e=>{e.stopPropagation();removeTrack(i)};
    playlistEl.appendChild(div);
  });
}

function play(i){
  if(!tracks[i])return;
  current=i;
  audio.src=tracks[i].url;
  audio.play();
  document.getElementById('nowTitle').textContent=tracks[i].name;
  document.getElementById('nowArtist').textContent=tracks[i].artist;
  document.getElementById('playBtn').textContent='⏸';
  render();
}

function next(auto=false){
  if(!tracks.length)return;
  if(repeatMode===1&&auto){audio.currentTime=0;audio.play();return}
  let i;
  if(shuffle){do{i=Math.floor(Math.random()*tracks.length)}while(tracks.length>1&&i===current)}
  else i=(current+1)%tracks.length;
  play(i);
}

function prev(){
  if(!tracks.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return}
  play((current-1+tracks.length)%tracks.length);
}

function removeTrack(i){
  URL.revokeObjectURL(tracks[i].url);
  tracks.splice(i,1);
  if(i===current){audio.pause();audio.removeAttribute('src');current=-1;
    document.getElementById('nowTitle').textContent='Şarkı seçilmedi';
    document.getElementById('nowArtist').textContent='Yerel müzik çaların';
    document.getElementById('playBtn').textContent='▶';}
  else if(i<current)current--;
  render();
}

const fmt=s=>isNaN(s)?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
audio.addEventListener('timeupdate',()=>{
  const seek=document.getElementById('seek');
  if(!seek.matches(':active')) seek.value=audio.duration?(audio.currentTime/audio.duration)*100:0;
  document.getElementById('currentTime').textContent=fmt(audio.currentTime);
  document.getElementById('duration').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('loadedmetadata',()=>{if(current>=0)tracks[current].duration=fmt(audio.duration);render()});

document.getElementById('playBtn').onclick=()=>{
  if(current<0&&tracks.length){play(0);return}
  if(audio.paused){audio.play();document.getElementById('playBtn').textContent='⏸'}
  else{audio.pause();document.getElementById('playBtn').textContent='▶'}
};
document.getElementById('nextBtn').onclick=()=>next();
document.getElementById('prevBtn').onclick=prev;
document.getElementById('seek').oninput=e=>{if(audio.duration)audio.currentTime=(e.target.value/100)*audio.duration};
document.getElementById('volume').oninput=e=>{
  audio.volume=e.target.value/100;
  document.getElementById('volLabel').textContent=e.target.value+'%';
};
audio.volume=.8;
document.getElementById('shuffleBtn').onclick=e=>{
  shuffle=!shuffle; e.target.classList.toggle('on',shuffle);
};
document.getElementById('repeatBtn').onclick=e=>{
  repeatMode=(repeatMode+1)%3;
  e.target.textContent='🔁 Tekrar: '+['Kapalı','Bu şarkı','Tümü'][repeatMode];
  e.target.classList.toggle('on',repeatMode>0);
};
document.getElementById('speed').onchange=e=>audio.playbackRate=+e.target.value;
document.getElementById('search').oninput=render;
document.getElementById('clearBtn').onclick=()=>{
  tracks.forEach(t=>URL.revokeObjectURL(t.url));
  tracks=[];current=-1;audio.pause();audio.removeAttribute('src');render();
};
document.getElementById('themeBtn').onclick=e=>{
  document.body.classList.toggle('light');
  e.target.textContent=document.body.classList.contains('light')?'☀️ Tema':'🌙 Tema';
};
render();
</script>
</body>
</html>
